name: Update Master EPG

on:
  schedule:
    - cron: '0 3 * * *' # Her gece TR saatiyle 06:00
  workflow_dispatch: # Manuel çalıştırmak için buton

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests
          npm install -g firebase-tools

      - name: Run Master Scraper
        run: python scripts/master_scraper.py # Dosya yolun scripts/ içindeyse 'python scripts/master_scraper.py' yap

      - name: Deploy to Firebase Hosting
        run: |
          # Firebase'e hangi projeye yükleyeceğini söylememiz lazım
          firebase use logo-manager-foundation --token "${{ secrets.FIREBASE_TOKEN }}"
          # Dosyaları (EPG ve logoları) fırlatıyoruz
          firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" -m "GitHub Action EPG Update"

      - name: Commit and push changes to GitHub (Opsiyonel)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add epg/*
          git commit -m "Master EPG updated" || exit 0
          git push
